name: Embedded C++17 Application CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Native C++17 Compilation (Ubuntu GCC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Native User-Space Sensor Application
        run: |
          make clean && make
          echo "850" > mock_iio_raw.txt
          ./app_sensor mock_iio_raw.txt 2
          echo "3600" > mock_iio_raw.txt
          ./app_sensor mock_iio_raw.txt 2
          rm -f mock_iio_raw.txt

      - name: Install ARM Cross-Compiler & Build ARM Target (STM32MP157D-DK1)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-arm-linux-gnueabihf file
          bash scripts/cross_build.sh
          file app_sensor_arm
